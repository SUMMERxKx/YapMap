<!--
  The Yap mark: a map pin whose head is a speech bubble with a "typing" ellipsis.
  Pure geometry on a 500 x 615 grid, so it can be rebuilt by hand:
  - head: circle, centre (250, 250), radius 250
  - tip: the two tangent lines from (250, 625), rounded off over the last 28 units
  - dots: three circles of radius 36 at x = 140, 250, 360 on the head's centre line
  The dots are holes (evenodd), so whatever is behind the mark shows through them.
  Every app icon, splash and favicon is generated from this file by scripts/make-icons.sh.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="615" viewBox="0 0 500 615">
  <path
    fill="#FAF8F5"
    fill-rule="evenodd"
    d="M 63.7 416.7 A 250 250 0 1 1 436.3 416.7 L 268.6 604.2 Q 250 625 231.4 604.2 Z
       M 104 250 A 36 36 0 1 0 176 250 A 36 36 0 1 0 104 250 Z
       M 214 250 A 36 36 0 1 0 286 250 A 36 36 0 1 0 214 250 Z
       M 324 250 A 36 36 0 1 0 396 250 A 36 36 0 1 0 324 250 Z" />
</svg>
