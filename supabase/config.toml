# Local development stack for `supabase start` / `supabase db reset`. Trimmed from the
# `supabase init` defaults: https://supabase.com/docs/guides/local-development/cli/config
#
# This file only configures the local stack. The hosted project's settings live in its
# dashboard and change only if someone runs `supabase config push` - don't.
project_id = "yapmap"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted database (Postgres 17).
major_version = 17

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Emails are not sent: read them in the local mail viewer at http://127.0.0.1:54324.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Same as the app (PASSWORD_MIN_LENGTH) and the hosted project.
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
# A new account confirms its email with a code before it can sign in.
enable_confirmations = true
secure_password_change = false
max_frequency = "1s"
# The app asks for an 8-digit code.
otp_length = 8
otp_expiry = 3600

# The app can't open email links, so these emails show the code ({{ .Token }}).
[auth.email.template.confirmation]
subject = "Confirm your Yap account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Yap password"
content_path = "./supabase/templates/recovery.html"

[edge_runtime]
enabled = false

[analytics]
enabled = false
