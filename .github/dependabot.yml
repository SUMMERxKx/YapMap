# Weekly dependency update pull requests. CI runs on each one like on any other PR.
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Expo's own packages, kept inside the current SDK by the ignore rules below.
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*', 'eslint-config-expo']
        update-types: [minor, patch]
      # Everything else that isn't a major version: one PR a week instead of many.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # The Expo SDK decides these versions, and `npx expo-doctor` fails on anything else.
      # They move together during an SDK upgrade (docs/RELEASING.md), never on their own.
      # Packages with a ~x.y range (expo-*, ~57.0.x): patch releases still fit the SDK.
      - dependency-name: 'expo'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'expo-*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'eslint-config-expo'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@expo/*'
        update-types: [version-update:semver-major]
      - dependency-name: 'react-native-gesture-handler'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-native-safe-area-context'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-native-screens'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: 'react-native-web'
        update-types: [version-update:semver-major, version-update:semver-minor]
      # SDK packages pinned to one exact version: any change is an SDK upgrade.
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-maps'
      - dependency-name: 'react-native-reanimated'
      - dependency-name: 'react-native-svg'
      - dependency-name: 'react-native-worklets'
      - dependency-name: '@react-native-async-storage/async-storage'
      - dependency-name: '@react-native-community/datetimepicker'
      - dependency-name: '@react-native-community/slider'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns: ['*']
