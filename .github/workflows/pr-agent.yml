# AI code review on pull requests with PR-Agent (open source, MIT), running in GitHub Actions
# with a Google AI Studio (Gemini) API key. Off until the owner turns it on; see
# docs/RELEASING.md "AI code review" for the one-time setup and what gets sent to Google.
# Review focus and options live in .pr_agent.toml.
name: AI review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  # Comments like "/review" or "/improve" on a pull request run that tool again.
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-agent:
    name: PR-Agent
    # Skipped (not failed) until the repository variable PR_AGENT_ENABLED is "true".
    if: >-
      vars.PR_AGENT_ENABLED == 'true' &&
      github.event.sender.type != 'Bot' &&
      (github.event_name == 'pull_request' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: the-pr-agent/pr-agent@981344be2755e303df501e18e3f60b848a188a80 # v0.48.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: ${{ vars.PR_AGENT_MODEL || 'gemini/gemini-3.8-flash' }}
          config.fallback_models: '["gemini/gemini-3.5-flash-lite"]'
          github_action_config.auto_review: 'true'
          github_action_config.auto_improve: 'true'
          # The PR description is the author's own; PR-Agent leaves it alone.
          github_action_config.auto_describe: 'false'
